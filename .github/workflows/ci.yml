name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  # Test Go microservices
  test-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, search-service, pricing-service, data-ingestion-service]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Run tests
      working-directory: ./services/${{ matrix.service }}
      run: |
        go mod download
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.service }}
        path: ./services/${{ matrix.service }}/coverage.html

  # Lint Go code
  lint-services:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        working-directory: ./services
        args: --config ../.golangci.yml

  # Test and build frontend
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run linting
      working-directory: ./frontend
      run: npm run lint
    
    - name: Run type checking
      working-directory: ./frontend
      run: npm run type-check
    
    - name: Run unit tests
      working-directory: ./frontend
      run: npm run test:coverage
    
    - name: Run integration tests
      working-directory: ./frontend
      run: npm run test:integration
    
    - name: Run API contract tests
      working-directory: ./frontend
      run: npm run test:contracts
    
    - name: Run performance tests
      working-directory: ./frontend
      run: npm run test:performance
    
    - name: Generate API documentation
      working-directory: ./frontend
      run: npm run docs:api
    
    - name: Build application
      working-directory: ./frontend
      run: npm run build
    
    - name: Analyze bundle size
      working-directory: ./frontend
      run: npm run analyze
      
    - name: Check bundle size limits
      working-directory: ./frontend
      run: |
        echo "🔍 Checking bundle size limits..."
        npm run bundle:size || {
          echo "❌ Bundle size exceeds limits!"
          echo "📊 Current bundle analysis:"
          ls -la .next/static/js/ | head -10
          exit 1
        }
        echo "✅ Bundle size within limits"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/.next
        
    - name: Upload bundle analysis
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis
        path: frontend/analyze/
        
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: test-coverage
        path: frontend/coverage/
        
    - name: Upload API documentation
      uses: actions/upload-artifact@v4
      with:
        name: api-documentation
        path: frontend/docs/api/generated/
        
    - name: Comment test coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const coverage = JSON.parse(fs.readFileSync('frontend/coverage/coverage-summary.json', 'utf8'));
            const { lines, functions, branches, statements } = coverage.total;
            
            const comment = `## 📊 Test Coverage Report
            
            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Lines | ${lines.pct}% | ${lines.pct >= 70 ? '✅' : '❌'} |
            | Functions | ${functions.pct}% | ${functions.pct >= 70 ? '✅' : '❌'} |
            | Branches | ${branches.pct}% | ${branches.pct >= 70 ? '✅' : '❌'} |
            | Statements | ${statements.pct}% | ${statements.pct >= 70 ? '✅' : '❌'} |
            
            ${lines.pct >= 70 ? '🎉 Coverage targets met!' : '⚠️ Coverage below target (70%)'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not read coverage report:', error.message);
          }

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Validate Terraform
  validate-terraform:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
    
    - name: Terraform Format Check
      working-directory: ./infrastructure
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      working-directory: ./infrastructure
      run: terraform init -backend=false
    
    - name: Terraform Validate
      working-directory: ./infrastructure
      run: terraform validate -no-color
    
    - name: Run tflint
      uses: terraform-linters/setup-tflint@v3
    
    - name: TFLint
      working-directory: ./infrastructure
      run: |
        tflint --init
        tflint --recursive