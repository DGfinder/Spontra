name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-jwt-secret-32chars-minimum
          ADMIN_JWT_SECRET: ci-test-admin-jwt-secret-32chars
          AMADEUS_CLIENT_ID: test_amadeus_client_id
          AMADEUS_CLIENT_SECRET: test_amadeus_client_secret
          RESEND_API_KEY: test_resend_key
          NEXT_PUBLIC_SENTRY_DSN: ''

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Build-time stubs — real secrets injected at runtime via Vercel env vars
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          JWT_SECRET: build-time-stub-secret-not-real-32c
          ADMIN_JWT_SECRET: build-time-stub-admin-secret-32chars
          AMADEUS_CLIENT_ID: stub
          AMADEUS_CLIENT_SECRET: stub
          RESEND_API_KEY: stub
          NEXT_PUBLIC_APP_URL: https://spontra.com
          SKIP_DB_SEED: true
